name: Publish private report viewer
on:
  push:
    branches: [main]
    paths:
      - 'protected/**'
      - '.github/workflows/publish-report.yml'
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble viewer and encrypted release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p site
          cp protected/index.html protected/lock.js protected/password-envelope.json site/
          TAG="$(gh release view --json tagName --jq .tagName)"
          gh release download "$TAG" --pattern report.sealed --dir site
          test "$(head -c 8 site/report.sealed)" = RPTLOCK1
          sha256sum site/report.sealed
      - id: artifact
        run: echo "name=github-pages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: ${{ steps.artifact.outputs.name }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
