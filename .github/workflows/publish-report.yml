name: Publish private report viewer
on:
  push:
    branches: [main]
    paths:
      - 'protected/**'
      - '.github/workflows/publish-report.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble viewer and encrypted release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p site
          cp protected/index.html protected/lock.js protected/password-envelope.json site/
          TAG="$(gh release view --json tagName --jq .tagName)"
          gh release download "$TAG" --pattern report.sealed --dir site
          test "$(head -c 8 site/report.sealed)" = RPTLOCK1
          sha256sum site/report.sealed
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
